# Render.com blueprint for the DeshiCraft API.
# The frontend deploys separately to Vercel (see client/vercel.json).
# MongoDB is provided by MongoDB Atlas (free M0 tier) - set MONGO_URI below.
#
# Install from the monorepo root (not server/) so `npm ci` can use the root
# package-lock.json. rootDir: server would fail because server/ has no lockfile.
services:
  - type: web
    name: deshicraft-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace @deshicraft/server
    startCommand: npm start --workspace @deshicraft/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
