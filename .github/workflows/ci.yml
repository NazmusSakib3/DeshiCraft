name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server:
    name: Server (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --include=dev --ignore-scripts
      - name: Typecheck
        run: npm run typecheck --workspace @deshicraft/server
      - name: Build
        run: npm run build --workspace @deshicraft/server
      - name: Test
        run: npm test --workspace @deshicraft/server

  client:
    name: Client (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --include=dev --ignore-scripts
      - name: Typecheck
        run: npm run typecheck --workspace @deshicraft/client
      - name: Build
        run: npm run build --workspace @deshicraft/client

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --include=dev --ignore-scripts
      - name: Install Playwright browsers
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: https://deshicraft.vercel.app
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
